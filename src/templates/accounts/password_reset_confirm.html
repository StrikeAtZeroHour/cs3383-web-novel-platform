{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "Set new password" %}{% endblock %}
{% block content %}
<h1 class="h4 mb-3">{% trans "Set new password" %}</h1>
<form method="post" style="max-width: 420px;">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-accent" type="submit">{% trans "Save new password" %}</button>
</form>
{% endblock %}
