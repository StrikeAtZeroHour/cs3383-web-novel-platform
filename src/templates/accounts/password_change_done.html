{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Change password" %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <h1 class="h3 mb-4">{% trans "Change password" %}</h1>
    <div class="alert alert-success">{% trans "Your password has been changed." %}</div>
    <a class="btn btn-accent" href="{% url 'accounts:profile' %}">{% trans "Back to profile" %}</a>
  </div>
</div>
{% endblock %}
